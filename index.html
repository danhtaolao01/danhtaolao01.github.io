<h1>pg-backup</h1>
<p>pg-backup is a small internal Windows service that backs up PostgreSQL databases on a schedule
and uploads the backup files to the operator's own Google Drive.</p>
<p>It is not a public product. Only the person who runs it signs in, with their own Google account.</p>
